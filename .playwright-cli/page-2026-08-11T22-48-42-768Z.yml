            - img "Expand/Collapse" [ref=e263]
          - generic [ref=e264]: BlueChew products are compounded by state-licensed compounding pharmacies in the USA in partnership with BlueChew. Bluechew itself is not a compound pharmacy. These pharmacies prepare and dispense the compounded medications after prescription approval from a licensed healthcare provider.
        - generic [ref=e265]:
          - button "Who is BlueChew for? Expand/Collapse" [ref=e266] [cursor=pointer]:
            - generic [ref=e267]: Who is BlueChew for?
            - img "Expand/Collapse" [ref=e269]
          - generic [ref=e270]: BlueChew is for patients who are 18 years or older, are living in the United States, and want stronger and longer-lasting erections.
        - generic [ref=e271]:
          - button "Important safety information Expand/Collapse" [ref=e272] [cursor=pointer]:
            - generic [ref=e273]: Important safety information
            - img "Expand/Collapse" [ref=e275]
          - generic [ref=e276]:
            - paragraph [ref=e277]: Do not take Sildenafil (sildenafil citrate), Tadalafil, or Vardenafil if you take medication containing nitrates or guanylate cyclase stimulators for pulmonary hypertension as this could cause an unsafe drop in blood pressure. If you are allergic to Sildenafil, Tadalafil, or Vardenafil or any ingredients contained in these medications, do not consume BLUECHEW. Discuss your health with your provider to ensure that you are healthy enough for sex. If you experience chest pain, dizziness, or nausea during sex, seek immediate medical help. Sildenafil, Tadalafil, and Vardenafil can cause serious side effects.
            - paragraph [ref=e278]: "Some side effects include:"
            - list [ref=e279]:
              - listitem [ref=e280]: An erection lasting more than 4 hours. If you experience a prolonged erection, seek immediate medical attention as this can cause permanent damage if left untreated.
              - listitem [ref=e281]: Sudden vision loss in one or both eyes. This can be a sign of a serious eye problem. Stop taking the medication and call your healthcare provider right away if you experience these symptoms.
              - listitem [ref=e282]: Sudden hearing decrease, hearing loss, ringing in their ears (tinnitus) or dizziness. If you experience these symptoms, stop taking the medication and contact a healthcare provider right away.
            - text: Before taking BlueChew
            - superscript [ref=e283]:
              - superscript [ref=e284]: ®
            - text: "inform your healthcare provider if you:"
            - list [ref=e285]:
              - listitem [ref=e286]: Have or have had heart problems such as a heart attack, irregular heartbeat, angina, chest pain, narrowing of the aortic valve, or heart failure
              - listitem [ref=e287]: Have had heart surgery within the last 12 months
              - listitem [ref=e288]: Have pulmonary hypertension
              - listitem [ref=e289]: Have had a stroke
              - listitem [ref=e290]: Have low blood pressure or high blood pressure that is not controlled
              - listitem [ref=e291]: Have a deformed penis shape
              - listitem [ref=e292]: Have had an erection that lasted for more than 4 hours
              - listitem [ref=e293]: Have problems with your blood cells such as sickle cell anemia, multiple myeloma, or leukemia
              - listitem [ref=e294]: Have retinitis pigmentosa, a rare genetic (runs in families) eye disease
              - listitem [ref=e295]: Have ever had severe vision loss, including an eye problem called NAION
              - listitem [ref=e296]: Have bleeding problems
              - listitem [ref=e297]: Have or have had stomach ulcers
              - listitem [ref=e298]: Have liver problems
              - listitem [ref=e299]: Have kidney problems or currently undergoing dialysis treatment
              - listitem [ref=e300]: Have any other medical conditions
            - paragraph [ref=e301]: Tell your healthcare provider about all the medicines you take, including prescription and over-the-counter medicines, vitamins, and herbal supplements.
            - paragraph [ref=e302]: "Sildenafil, Tadalafil, and Vardenafil may affect how other medicines work, and other medicines may affect how these medications work, causing side effects. Please inform your healthcare provider if you take any of the following:"
            - list [ref=e303]:
              - listitem [ref=e304]: Nitrates- Guanylate cyclase stimulators such as Adempas (riociguat)
              - listitem [ref=e305]: Alpha-blockers such as Hytrin (terazosin HCl), Flomax (tamsulosin HCl), Cardura (doxazosin mesylate), Minipress (prazosin HCl), Uroxatral (alfuzosin HCl), Jalyn (dutasteride and tamsulosin HCl), or Rapaflo (silodosin HCl).
              - listitem [ref=e306]: HIV protease inhibitors, such as ritonavir (Norvir), indinavir sulfate (Crixivan), saquinavir (Fortovase or Invirase), or atazanavir sulfate (Reyataz)
              - listitem [ref=e307]: Some types of oral antifungal medicines, such as ketoconazole (Nizoral) and itraconazole (Sporanox)
              - listitem [ref=e308]: Some types of antibiotics, such as clarithromycin (Biaxin), telithromycin (Ketek), or erythromycin
              - listitem [ref=e309]: Other medicines that treat high blood pressure
              - listitem [ref=e310]: Other medicines or treatments for ED
            - paragraph [ref=e311]: Sildenafil, tadalafil, and vardenafil should not be used with REVATIO or with other PAH treatments containing sildenafil, tadalafil, vardenafil, or any other PDE5 inhibitors (such as Adcirca tadalafil)
            - paragraph [ref=e312]: Sildenafil, tadalafil, and vardenafil do not protect against sexually transmitted diseases, including HIV.
            - paragraph [ref=e313]: The most common side effects of sildenafil, tadalafil, and vardenafil include headache, flushing, runny nose, congestion, throat or nose irritation, back pain, muscle pain, upset stomach, and heartburn.
            - paragraph [ref=e314]: INDICATION
            - paragraph [ref=e315]: Sildenafil, Tadalafil, and Vardenafil are FDA-approved prescription medications for erectile dysfunction (ED) and are also prescribed off-label for other conditions.
